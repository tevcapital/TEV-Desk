<!-- TEV Desk variant: in-app decisions repository.
This feature exists in TEV Desk only. Other TEV apps (Loop, Agents, Board PH,
BT8BTC, Artists, Construction Desk) do not have this feature and are not
scheduled to receive it. This is a commissioned product feature, not a sweep.
DO NOT propagate to other apps during future cross-app work. Re-evaluate per app. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Decisions Repository</title>
    <style>
      :root {
        --bg: #f2f6fb;
        --card: #ffffff;
        --ink: #10253f;
        --muted: #5f7591;
        --line: #d4deea;
        --accent: #206cf4;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "SF Pro Text", "Helvetica Neue", sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      header {
        border-bottom: 1px solid var(--line);
        background: #fff;
        padding: 16px 20px 14px 80px;
      }
      header h1 { margin: 0; font-size: 18px; }
      header p { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
      main {
        padding: 18px 20px 20px;
      }
      .repo-shell {
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) minmax(320px, 0.9fr);
        gap: 16px;
        align-items: start;
      }
      .repo-main {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .filters {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }
      .filter {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .filter label {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--muted);
        text-transform: uppercase;
      }
      .filter select {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        padding: 10px 12px;
        font: inherit;
        color: var(--ink);
      }
      .list,
      .detail {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .card {
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--card);
        padding: 16px 18px;
        cursor: pointer;
      }
      .card:hover { border-color: #9fc0ff; }
      .meta {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .topic {
        font-size: 24px;
        font-weight: 700;
        line-height: 1.15;
        margin: 0 0 10px;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 10px;
      }
      .tag {
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #f7faff;
        padding: 4px 9px;
        font-size: 11px;
        color: var(--muted);
      }
      .participants {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 10px;
      }
      .preview {
        font-size: 14px;
        line-height: 1.5;
        color: var(--ink);
      }
      .empty {
        min-height: 360px;
        border: 1px dashed var(--line);
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.72);
      }
      .detail-card {
        border: 1px solid var(--line);
        border-radius: 18px;
        background: #fff;
        padding: 18px 20px 20px;
      }
      .back-btn,
      .danger-btn,
      .secondary-btn {
        border-radius: 10px;
        padding: 9px 12px;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }
      .back-btn,
      .secondary-btn {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
      }
      .danger-btn {
        border: 1px solid #dc2626;
        background: #dc2626;
        color: #fff;
      }
      .detail-top {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }
      .section {
        margin-top: 18px;
      }
      .section h2 {
        margin: 0 0 8px;
        font-size: 13px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .section p {
        margin: 0;
        font-size: 14px;
        line-height: 1.6;
        white-space: pre-wrap;
      }
      .transcript {
        margin: 0;
        padding: 12px 14px;
        border-radius: 12px;
        background: #f7faff;
        border: 1px solid var(--line);
        font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        white-space: pre-wrap;
      }
      .confirm {
        margin-top: 14px;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid #f1c7c7;
        background: #fff5f5;
        color: #7f1d1d;
      }
      .confirm-actions {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }
      .repo-chat-panel {
        border: 1px solid var(--line);
        border-radius: 18px;
        background: #fff;
        min-height: 620px;
        display: grid;
        grid-template-rows: auto 1fr auto;
        overflow: hidden;
      }
      .chat-head {
        border-bottom: 1px solid var(--line);
        padding: 16px 18px 14px;
      }
      .chat-head h2 {
        margin: 0;
        font-size: 17px;
      }
      .chat-head p {
        margin: 4px 0 0;
        font-size: 12px;
        color: var(--muted);
      }
      .chat-history {
        padding: 16px 18px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: linear-gradient(180deg, rgba(247, 250, 255, 0.7), rgba(255, 255, 255, 0));
      }
      .chat-empty {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }
      .chat-msg {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .chat-msg.user {
        align-items: flex-end;
      }
      .chat-msg.assistant {
        align-items: flex-start;
      }
      .chat-role {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--muted);
        text-transform: uppercase;
      }
      .chat-bubble {
        max-width: 100%;
        border-radius: 14px;
        padding: 11px 12px;
        font-size: 14px;
        line-height: 1.55;
        white-space: pre-wrap;
      }
      .chat-msg.user .chat-bubble {
        background: var(--accent);
        color: #fff;
        border-bottom-right-radius: 4px;
      }
      .chat-msg.assistant .chat-bubble {
        background: #f7faff;
        color: var(--ink);
        border: 1px solid var(--line);
        border-bottom-left-radius: 4px;
      }
      .chat-compose {
        border-top: 1px solid var(--line);
        padding: 14px 18px 18px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .chat-compose textarea {
        width: 100%;
        min-height: 88px;
        max-height: 180px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 11px 12px;
        font: inherit;
        font-size: 14px;
        color: var(--ink);
        outline: none;
      }
      .chat-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }
      .chat-status {
        min-height: 18px;
        font-size: 12px;
        color: var(--muted);
      }
      .chat-btns {
        display: flex;
        gap: 8px;
      }
      .chat-btn {
        border-radius: 10px;
        padding: 9px 12px;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }
      .chat-btn.send {
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
      }
      .chat-btn.clear {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
      }
      @media (max-width: 900px) {
        header { padding-left: 20px; }
        .repo-shell { grid-template-columns: 1fr; }
        .repo-chat-panel { min-height: 560px; }
        .chat-actions {
          flex-direction: column;
          align-items: stretch;
        }
        .chat-btns {
          width: 100%;
          justify-content: flex-end;
        }
        .filters { grid-template-columns: 1fr; }
        .topic { font-size: 20px; }
        .detail-top { flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Decisions Repository</h1>
      <p>Saved War Room decisions</p>
    </header>
    <main>
      <div class="repo-shell">
        <section class="repo-main">
          <section class="filters">
            <div class="filter">
              <label for="dateFilter">Date</label>
              <select id="dateFilter"></select>
            </div>
            <div class="filter">
              <label for="subjectFilter">Subject</label>
              <select id="subjectFilter"></select>
            </div>
            <div class="filter">
              <label for="themeFilter">Theme</label>
              <select id="themeFilter"></select>
            </div>
          </section>
          <section id="content"></section>
        </section>
        <!--
        TEV Desk variant: Decisions Repository chat.
        This feature exists in TEV Desk only. Other TEV apps (Loop, Agents, Board PH,
        BT8BTC, Artists, Construction Desk) do not have this feature and are not
        scheduled to receive it. This is a commissioned product feature, not a sweep.
        DO NOT propagate to other apps during future cross-app work. Re-evaluate per app.
        -->
        <aside class="repo-chat-panel">
          <div class="chat-head">
            <h2>Repository Chat</h2>
            <p>Ask across saved decisions</p>
          </div>
          <div class="chat-history" id="chatHistory"></div>
          <div class="chat-compose">
            <textarea id="chatInput" placeholder="Ask about saved decisions…"></textarea>
            <div class="chat-actions">
              <div class="chat-status" id="chatStatus"></div>
              <div class="chat-btns">
                <button type="button" class="chat-btn clear" id="clearChatBtn">Clear</button>
                <button type="button" class="chat-btn send" id="sendChatBtn">Send</button>
              </div>
            </div>
          </div>
        </aside>
      </div>
    </main>

    <script>
      const dateFilter = document.getElementById('dateFilter');
      const subjectFilter = document.getElementById('subjectFilter');
      const themeFilter = document.getElementById('themeFilter');
      const content = document.getElementById('content');
      const chatHistory = document.getElementById('chatHistory');
      const chatInput = document.getElementById('chatInput');
      const sendChatBtn = document.getElementById('sendChatBtn');
      const clearChatBtn = document.getElementById('clearChatBtn');
      const chatStatus = document.getElementById('chatStatus');

      let decisions = [];
      let activeDecisionId = null;
      let confirmDelete = false;
      let chatMessages = [];
      let chatLoading = false;

      function formatDisplayDate(value) {
        if (!value) return '';
        return new Intl.DateTimeFormat('en-US', {
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        }).format(new Date(`${value}T00:00:00Z`));
      }

      function truncate(text, max = 200) {
        const value = String(text || '').trim();
        if (value.length <= max) return value;
        return `${value.slice(0, max).trimEnd()}…`;
      }

      function populateSelect(select, items, allLabel) {
        const current = select.value;
        select.innerHTML = '';
        const allOption = document.createElement('option');
        allOption.value = '';
        allOption.textContent = allLabel;
        select.appendChild(allOption);
        items.forEach((item) => {
          const option = document.createElement('option');
          option.value = item;
          option.textContent = item;
          select.appendChild(option);
        });
        select.value = items.includes(current) ? current : '';
      }

      function populateFilters() {
        const dates = [...new Set(decisions.map((item) => item.date).filter(Boolean))].sort((a, b) => b.localeCompare(a));
        const subjects = [...new Set(decisions.map((item) => item.subject).filter(Boolean))].sort((a, b) => a.localeCompare(b));
        const themes = [...new Set(decisions.map((item) => item.theme).filter(Boolean))].sort((a, b) => a.localeCompare(b));
        populateSelect(dateFilter, dates, 'All dates');
        populateSelect(subjectFilter, subjects, 'All subjects');
        populateSelect(themeFilter, themes, 'All themes');
      }

      function getFilteredDecisions() {
        return decisions.filter((item) => {
          if (dateFilter.value && item.date !== dateFilter.value) return false;
          if (subjectFilter.value && item.subject !== subjectFilter.value) return false;
          if (themeFilter.value && item.theme !== themeFilter.value) return false;
          return true;
        });
      }

      function renderList() {
        const filtered = getFilteredDecisions();
        if (!filtered.length) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = decisions.length
            ? 'No decisions match the current filters.'
            : 'No decisions saved yet. Use Save Decision in the War Room to create your first entry.';
          content.innerHTML = '';
          content.appendChild(empty);
          return;
        }

        const list = document.createElement('div');
        list.className = 'list';
        filtered.forEach((item) => {
          const card = document.createElement('button');
          card.type = 'button';
          card.className = 'card';
          card.innerHTML = `
            <div class="meta">${formatDisplayDate(item.date)}</div>
            <h2 class="topic">${item.topic || 'Untitled decision'}</h2>
            <div class="tags">
              <span class="tag">${item.theme || 'No theme'}</span>
              <span class="tag">${item.subject || 'No subject'}</span>
            </div>
            <div class="participants">${(item.participants || []).join(', ')}</div>
            <div class="preview">${truncate(item.decisionText, 200)}</div>
          `;
          card.addEventListener('click', () => {
            activeDecisionId = item.id;
            confirmDelete = false;
            render();
          });
          list.appendChild(card);
        });
        content.innerHTML = '';
        content.appendChild(list);
      }

      async function handleDelete(id) {
        const result = await window.desk.decisions.delete(id);
        if (!result?.ok) return;
        const refreshed = await window.desk.decisions.list();
        decisions = Array.isArray(refreshed?.decisions) ? refreshed.decisions : [];
        activeDecisionId = null;
        confirmDelete = false;
        populateFilters();
        render();
      }

      function renderDetail() {
        const item = decisions.find((entry) => entry.id === activeDecisionId);
        if (!item) {
          activeDecisionId = null;
          renderList();
          return;
        }

        const wrap = document.createElement('div');
        wrap.className = 'detail';
        wrap.innerHTML = `
          <div class="detail-card">
            <div class="detail-top">
              <button type="button" class="back-btn" id="backBtn">← Back to list</button>
              <div class="meta">${formatDisplayDate(item.date)}</div>
            </div>
            <h2 class="topic">${item.topic || 'Untitled decision'}</h2>
            <div class="tags">
              <span class="tag">${item.theme || 'No theme'}</span>
              <span class="tag">${item.subject || 'No subject'}</span>
            </div>
            <div class="participants">${(item.participants || []).join(', ')}</div>
            <div class="section">
              <h2>Decision</h2>
              <p>${item.decisionText || ''}</p>
            </div>
            <div class="section">
              <h2>Rationale</h2>
              <p>${item.rationale || ''}</p>
            </div>
            <div class="section">
              <h2>Transcript Excerpt</h2>
              <pre class="transcript">${item.transcriptExcerpt || ''}</pre>
            </div>
            <div class="section">
              <button type="button" class="danger-btn" id="deleteBtn">Delete</button>
              ${confirmDelete ? `
                <div class="confirm">
                  Delete this decision? This cannot be undone.
                  <div class="confirm-actions">
                    <button type="button" class="danger-btn" id="confirmDeleteBtn">Confirm</button>
                    <button type="button" class="secondary-btn" id="cancelDeleteBtn">Cancel</button>
                  </div>
                </div>
              ` : ''}
            </div>
          </div>
        `;
        content.innerHTML = '';
        content.appendChild(wrap);

        document.getElementById('backBtn').addEventListener('click', () => {
          activeDecisionId = null;
          confirmDelete = false;
          render();
        });
        document.getElementById('deleteBtn').addEventListener('click', () => {
          confirmDelete = true;
          render();
        });
        if (confirmDelete) {
          document.getElementById('confirmDeleteBtn').addEventListener('click', () => handleDelete(item.id));
          document.getElementById('cancelDeleteBtn').addEventListener('click', () => {
            confirmDelete = false;
            render();
          });
        }
      }

      function render() {
        if (activeDecisionId) {
          renderDetail();
          return;
        }
        renderList();
      }

      function scrollChatToBottom() {
        chatHistory.scrollTop = chatHistory.scrollHeight;
      }

      function setChatStatus(text = '') {
        chatStatus.textContent = text;
      }

      function setChatLoadingState(loading) {
        chatLoading = loading;
        sendChatBtn.disabled = loading;
        chatInput.disabled = loading;
      }

      // TEV Desk variant: Decisions Repository chat.
      // This feature exists in TEV Desk only. Other TEV apps (Loop, Agents, Board PH,
      // BT8BTC, Artists, Construction Desk) do not have this feature and are not
      // scheduled to receive it. This is a commissioned product feature, not a sweep.
      // DO NOT propagate to other apps during future cross-app work. Re-evaluate per app.
      function renderChat() {
        chatHistory.innerHTML = '';
        if (!chatMessages.length) {
          const empty = document.createElement('div');
          empty.className = 'chat-empty';
          empty.textContent = 'Ask a question about your saved decisions.';
          chatHistory.appendChild(empty);
          return;
        }

        chatMessages.forEach((message) => {
          const wrap = document.createElement('div');
          wrap.className = `chat-msg ${message.role}`;

          const role = document.createElement('div');
          role.className = 'chat-role';
          role.textContent = message.role === 'user' ? 'You' : 'Repository';

          const bubble = document.createElement('div');
          bubble.className = 'chat-bubble';
          bubble.textContent = String(message.content || '');

          wrap.appendChild(role);
          wrap.appendChild(bubble);
          chatHistory.appendChild(wrap);
        });

        scrollChatToBottom();
      }

      // TEV Desk variant: Decisions Repository chat.
      // This feature exists in TEV Desk only. Other TEV apps (Loop, Agents, Board PH,
      // BT8BTC, Artists, Construction Desk) do not have this feature and are not
      // scheduled to receive it. This is a commissioned product feature, not a sweep.
      // DO NOT propagate to other apps during future cross-app work. Re-evaluate per app.
      async function sendRepositoryChat(messageOverride = '') {
        if (chatLoading) return;
        const message = String(messageOverride || chatInput.value || '').trim();
        if (!message) return;

        chatMessages.push({ role: 'user', content: message });
        renderChat();
        chatInput.value = '';
        setChatStatus('Thinking…');
        setChatLoadingState(true);

        try {
          const result = await window.desk.decisions.chat({
            message,
            history: chatMessages
          });
          if (result?.ok) {
            chatMessages.push({
              role: 'assistant',
              content: String(result.answer || 'Repository chat returned an empty answer.')
            });
          } else {
            chatMessages.push({
              role: 'assistant',
              content: 'Repository chat failed — try again.'
            });
          }
        } catch (_) {
          chatMessages.push({
            role: 'assistant',
            content: 'Repository chat failed — try again.'
          });
        } finally {
          setChatLoadingState(false);
          setChatStatus('');
          renderChat();
          chatInput.focus();
        }
      }

      async function init() {
        const result = await window.desk.decisions.list();
        decisions = Array.isArray(result?.decisions) ? result.decisions : [];
        populateFilters();
        render();
        renderChat();
      }

      dateFilter.addEventListener('change', render);
      subjectFilter.addEventListener('change', render);
      themeFilter.addEventListener('change', render);
      sendChatBtn.addEventListener('click', () => sendRepositoryChat());
      clearChatBtn.addEventListener('click', () => {
        chatMessages = [];
        setChatStatus('');
        renderChat();
      });
      chatInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          sendRepositoryChat();
        }
      });

      init();
    </script>
  </body>
</html>
